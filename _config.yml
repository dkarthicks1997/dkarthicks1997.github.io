# Site settings
title: "Karthick Durai"
description: "Get to Know Karthick"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Karthick Durai"
resume_title:                   "Data Scientist"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "dkarthicks27@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "None"
resume_contact_address:         "None"

resume_header_contact_info:     "None"
