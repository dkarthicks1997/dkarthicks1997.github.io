# Site settings
title: "Karthick Durai"
description: "Get to Know Karthick"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Karthick Durai"
