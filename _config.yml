resume_header_intro: "<p>A seasoned <b>data scientist</b> with a background in full-stack software development. I’ve built end-to-end systems, explored the entire tech stack, and eventually found my passion in data and AI. Since then, I’ve worked on impactful projects like Graph RAGs, Agents to address multi-hop Q&A problems, and have fine-tuned LLMs using PEFT. I enjoy turning complex data into smart, real-world solutions—and I’m always experimenting, teaching, and learning along the way.</p>"
