resume_header_intro: "<p>Hey! I’m Karthick — a data scientist who loves building smart AI systems. I’ve worked on everything from Graph RAGs and multi-hop Q&A to fine-tuning LLMs for real-world tasks. I’m also into teaching, experimenting with cool tech, and making sense of messy data.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
